<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Gotch - Tamagotchi Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1p', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #ede9fe 50%, #e0f2fe 100%);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }
        .pixel-font {
            font-family: 'VT323', monospace;
        }
        .tamagotchi-shell {
            background: radial-gradient(circle at 30% 30%, #ffc0cb 0%, #ff9ebb 50%, #ff7597 100%);
            box-shadow: 
                inset 0 10px 20px rgba(255,255,255,0.6),
                inset 0 -10px 20px rgba(180,50,90,0.4),
                0 15px 35px rgba(255, 105, 180, 0.3);
        }
        .lcd-screen {
            background: #dbeafe;
            box-shadow: inset 0 0 10px rgba(30, 58, 138, 0.3);
            border: 4px solid #1e3a8a;
        }
        .glow-btn {
            transition: all 0.1s ease;
        }
        .glow-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center min-h-screen py-4 px-4">

    <!-- Top Bar -->
    <header class="w-full max-w-md flex justify-between items-center px-4 py-2 z-10">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🌿</span>
            <span id="current-time" class="font-bold text-gray-700 text-lg">18:33</span>
        </div>
        <div class="flex items-center space-x-3 text-gray-700">
            <button id="music-btn" class="w-9 h-9 rounded-full bg-white/80 shadow flex items-center justify-center glow-btn text-pink-600 hover:bg-white">
                🎵
            </button>
            <span class="text-lg">📶</span>
            <span class="text-lg">🔋</span>
        </div>
    </header>

    <!-- Main Content Area / Tamagotchi Device -->
    <main class="w-full max-w-md flex flex-col items-center my-auto py-2">
        
        <!-- Tamagotchi Shell (Redesigned as per image) -->
        <div class="tamagotchi-shell relative w-72 h-[380px] rounded-[50%] flex flex-col items-center justify-between p-6 shadow-2xl">
            <!-- Decorative Angel Wings (Deco) -->
            <div class="absolute left-[-15px] top-[140px] text-2xl animate-pulse">🪽</div>
            <div class="absolute right-[-15px] top-[140px] text-2xl animate-pulse scale-x-[-1]">🪽</div>

            <!-- Header Emoji (หัวใจ 3 ดวง / หัวข้อ) ด้านบนจอในตัวเครื่อง -->
            <div class="flex space-x-1 mt-1 text-sm">
                <span>💖</span>
                <span>💖</span>
                <span>💖</span>
            </div>

            <!-- LCD Screen (รูปแบบ Pic ตรงกลาง และ Contact ด้านล่างจอ) -->
            <div class="lcd-screen w-60 h-44 rounded-2xl flex flex-col justify-between relative overflow-hidden my-2">
                
                <!-- Pic Area (พื้นที่แสดงตัวละคร) -->
                <div class="flex-1 flex flex-col items-center justify-center relative">
                    <!-- Background Star in LCD -->
                    <div class="absolute text-blue-300 opacity-60 text-7xl select-none pointer-events-none">⭐</div>
                    
                    <!-- Angel Gotch Character -->
                    <div id="character" class="relative z-10 text-5xl transition-transform duration-300 animate-bounce">
                        👼🏻
                    </div>
                </div>

                <!-- Contact Area (แถบข้อความ/ติดต่อล่างจอภายใน LCD) -->
                <div class="bg-white/90 text-blue-900 text-xs px-2 py-1.5 border-t-2 border-blue-900 text-center font-bold z-10 truncate" id="screen-message">
                    ติดต่อเราหรือพูดคุยกับผู้ดูแลระบบ 💬
                </div>
            </div>

            <!-- Tamagotchi 3 Action Buttons (กด้อน, ตรงกลาง, ถัดไป) -->
            <div class="flex space-x-6 mb-2 items-center">
                <div class="flex flex-col items-center">
                    <button onclick="prevAction()" class="w-11 h-11 rounded-full bg-white shadow-md flex items-center justify-center glow-btn border border-pink-200 text-base" title="กด้อน">
                        ◀️
                    </button>
                    <span class="text-[10px] text-pink-900 font-bold mt-1">กด้อน</span>
                </div>
                <div class="flex flex-col items-center">
                    <button onclick="middleAction()" class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center glow-btn border border-pink-200 text-lg" title="ตรงกลาง">
                        ✨
                    </button>
                    <span class="text-[10px] text-pink-900 font-bold mt-1">ตรงกลาง</span>
                </div>
                <div class="flex flex-col items-center">
                    <button onclick="nextAction()" class="w-11 h-11 rounded-full bg-white shadow-md flex items-center justify-center glow-btn border border-pink-200 text-base" title="ถัดไป">
                        ▶️
                    </button>
                    <span class="text-[10px] text-pink-900 font-bold mt-1">ถัดไป</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar (Bar เลือกหมวดหมู่ต่าง ๆ) -->
    <nav class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-full shadow-lg px-4 py-3 flex justify-around items-center mb-2 z-10 border border-white/50">
        <!-- Home -->
        <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center text-pink-600 transition-all">
            <span class="text-xl">🏠</span>
            <span class="text-xs font-bold mt-0.5">Home</span>
        </button>
        <!-- Group -->
        <button onclick="switchTab('group')" id="tab-group" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all">
            <span class="text-xl">📁</span>
            <span class="text-xs font-semibold mt-0.5">Group</span>
        </button>
        <!-- Check Queue -->
        <button onclick="switchTab('queue')" id="tab-queue" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all">
            <span class="text-xl">📋</span>
            <span class="text-xs font-semibold mt-0.5">Check Queue</span>
        </button>
        <!-- Contact -->
        <button onclick="switchTab('contact')" id="tab-contact" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all">
            <span class="text-xl">📖</span>
            <span class="text-xs font-semibold mt-0.5">Contact</span>
        </button>
    </nav>

    <script>
        // Real-time clock update
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let modeIndex = 0;
        const modes = [
            { text: "ยินดีต้อนรับสู่หน้าแรก Angel Gotch 👼✨", char: "👼🏻" },
            { text: "ให้อาหาร: อร่อยจัง ยัมมี่! 🍔✨", char: "🍔" },
            { text: "เล่นสนุก: เย้ สนุกจังเลย! 🎮💖", char: "🎮" },
            { text: "นอนหลับ: Zzz... ฝันดีนะ 🌙", char: "😴" }
        ];

        function showMsg(text) {
            document.getElementById('screen-message').innerText = text;
        }

        function updateDisplay() {
            document.getElementById('screen-message').innerText = modes[modeIndex].text;
            document.getElementById('character').innerText = modes[modeIndex].char;
            animateCharacter();
        }

        function prevAction() {
            modeIndex = (modeIndex - 1 + modes.length) % modes.length;
            updateDisplay();
        }

        function middleAction() {
            showMsg("เลือกคำสั่งสำเร็จ! ✨");
            animateCharacter();
        }

        function nextAction() {
            modeIndex = (modeIndex + 1) % modes.length;
            updateDisplay();
        }

        function animateCharacter() {
            const char = document.getElementById('character');
            char.style.transform = "scale(1.2) rotate(10deg)";
            setTimeout(() => {
                char.style.transform = "scale(1) rotate(0deg)";
            }, 300);
        }

        // Bottom Navigation Tab Switching
        function switchTab(tabName) {
            ['home', 'group', 'queue', 'contact'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                btn.className = "flex flex-col items-center text-gray-400 hover:text-gray-600 transition-all";
            });

            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.className = "flex flex-col items-center text-pink-600 font-bold transition-all scale-105";

            if (tabName === 'home') {
                showMsg("หน้าแรก Angel Gotch 👼✨");
            } else if (tabName === 'group') {
                showMsg("หมวดหมู่ Group คอลเลกชัน 📁");
            } else if (tabName === 'queue') {
                showMsg("รายการตรวจสอบ Check Queue 📋");
            } else if (tabName === 'contact') {
                showMsg("ติดต่อเราหรือพูดคุยกับผู้ดูแล 📞💬");
            }
        }

        // Simple Web Audio Sound Effect on Music Button Click
        document.getElementById('music-btn').addEventListener('click', () => {
            showMsg("🎵 กำลังเล่นเสียงดนตรีแบ๊คกรา운ด์");
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.2);
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        });
    </script>
</body>
</html>
